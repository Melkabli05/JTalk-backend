<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hallway - Live Communication Tester</title>
<style>
  :root {
    --bg:#e9e3da; --paper:#f6f1e9; --card:#fffdf9; --ink:#1f1d1a; --mute:#7a7268; --line:#e4dccf;
    --green:#1f9d55; --green-soft:#dff3e6; --accent:#2f6fed; --red:#d64545; --amber:#e8a317; --shadow:0 6px 24px #0002;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14130f; --paper:#1d1b17; --card:#26231e; --ink:#f2ede4; --mute:#a39a8c; --line:#37332b; --green-soft:#183a26; --shadow:0 6px 24px #0008; }
  }
  * { box-sizing:border-box; }
  html, body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  button, input, select { font:inherit; color:inherit; }
  button { cursor:pointer; border:0; border-radius:999px; padding:9px 16px; background:var(--card); box-shadow:0 1px 0 var(--line), 0 1px 4px #0002; }
  button.primary { background:var(--green); color:#fff; font-weight:600; }
  button.danger { background:var(--red); color:#fff; }
  button.ghost { background:transparent; box-shadow:none; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input, select { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px; background:var(--card); }

  .top { display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:12px 18px; }
  .top h1 { font-size:18px; margin:0 auto 0 0; letter-spacing:-.02em; }
  .top small { color:var(--mute); }
  #phones { display:flex; gap:22px; padding:6px 18px 22px; overflow-x:auto; align-items:flex-start; }

  /* ---- the phone ---- */
  .phone { position:relative; flex:0 0 auto; width:390px; height:780px; background:var(--paper); border:9px solid #151515; border-radius:42px;
           box-shadow:var(--shadow); overflow:hidden; display:flex; flex-direction:column; }
  .status { display:flex; align-items:center; gap:8px; padding:10px 14px 6px; font-size:12px; }
  .status select { padding:5px 8px; border-radius:999px; width:auto; flex:1; font-weight:600; }
  .status .x { padding:3px 9px; }
  .scroll { flex:1; overflow-y:auto; padding:4px 16px 96px; }
  h2.title { font-size:22px; margin:6px 0 10px; letter-spacing:-.02em; }
  .chips { display:flex; gap:7px; overflow-x:auto; padding:2px 0 10px; }
  .chip { flex:0 0 auto; padding:6px 12px; border-radius:999px; background:var(--card); box-shadow:0 0 0 1px var(--line); white-space:nowrap; cursor:pointer; }
  .chip.on { background:var(--ink); color:var(--paper); }
  .empty { text-align:center; color:var(--mute); padding:36px 10px; }

  .room-card { background:var(--card); border-radius:18px; padding:14px; margin-bottom:12px; box-shadow:0 1px 0 var(--line), 0 2px 10px #0001; cursor:pointer; }
  .room-card:active { transform:scale(.99); }
  .room-card h3 { margin:0 0 2px; font-size:16px; }
  .room-card .topic { color:var(--mute); margin-bottom:8px; }
  .langs { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
  .lang { font-size:12px; padding:2px 9px; border-radius:999px; background:var(--green-soft); }
  .lang.alt { background:transparent; box-shadow:0 0 0 1px var(--line); }
  .meta { display:flex; align-items:center; gap:12px; color:var(--mute); font-size:12.5px; }
  .stack { display:flex; } .stack .avatar { margin-left:-9px; border:2px solid var(--card); } .stack .avatar:first-child { margin-left:0; }
  .fab { position:absolute; left:50%; transform:translateX(-50%); bottom:18px; padding:13px 22px; box-shadow:0 6px 20px #0004; }

  .avatar { flex:0 0 auto; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; position:relative; user-select:none; }
  .avatar.speaking { box-shadow:0 0 0 3px var(--paper), 0 0 0 6px var(--green); }
  .tap { cursor:pointer; text-align:center; }
  .grid { display:grid; gap:14px 6px; }
  .grid.stage { grid-template-columns:repeat(3, 1fr); } .grid.aud { grid-template-columns:repeat(4, 1fr); }
  .cell { display:flex; flex-direction:column; align-items:center; min-width:0; gap:3px; }
  .cell .nm { font-size:12.5px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .cell .sub { font-size:11px; color:var(--mute); }
  .badge { position:absolute; right:-3px; bottom:-3px; width:24px; height:24px; border-radius:50%; background:var(--card); display:grid; place-items:center; font-size:13px; box-shadow:0 0 0 1px var(--line); }
  .seat { width:76px; height:76px; border-radius:50%; border:2px dashed var(--line); display:grid; place-items:center; color:var(--mute); font-size:26px; background:transparent; padding:0; box-shadow:none; }
  .section { margin:18px 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--mute); display:flex; justify-content:space-between; }
  .hands { display:flex; gap:8px; flex-wrap:wrap; }
  .hand { display:flex; align-items:center; gap:7px; padding:5px 6px 5px 5px; border-radius:999px; background:var(--card); box-shadow:0 0 0 1px var(--line); }
  .hand button { padding:4px 10px; font-size:12px; }
  .banner { margin:8px 0; padding:8px 12px; border-radius:12px; background:var(--green-soft); font-size:13px; display:flex; justify-content:space-between; align-items:center; gap:8px; }

  .roombar { position:absolute; left:0; right:0; bottom:0; padding:12px 14px 16px; background:linear-gradient(transparent, var(--paper) 30%); display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .roombar button { padding:9px 13px; font-size:13px; }
  .roomhead { display:flex; align-items:center; gap:6px; padding:0 0 6px; }
  .roomhead .t { flex:1; min-width:0; } .roomhead h3 { margin:0; font-size:17px; } .roomhead .topic { color:var(--mute); font-size:13px; }

  .sheet-bg { position:absolute; inset:0; background:#0006; display:flex; align-items:flex-end; z-index:5; }
  .sheet { width:100%; background:var(--card); border-radius:26px 26px 0 0; padding:18px 18px 22px; max-height:88%; overflow-y:auto; }
  .sheet h3 { margin:0 0 10px; } .sheet label { display:block; font-size:12px; color:var(--mute); margin:10px 0 3px; }
  .sheet .actions { display:flex; flex-direction:column; gap:8px; margin-top:14px; }
  .sheet .actions button { width:100%; padding:12px; border-radius:14px; }
  .sheet .who { display:flex; gap:12px; align-items:center; margin-bottom:6px; }
  .two { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .toastbox { position:absolute; left:12px; right:12px; top:50px; display:flex; flex-direction:column; gap:6px; z-index:9; pointer-events:none; }
  .toast { background:var(--ink); color:var(--paper); padding:9px 13px; border-radius:14px; font-size:13px; box-shadow:var(--shadow); }
  .toast.err { background:var(--red); color:#fff; }

  /* ---- developer tools ---- */
  .dev { margin:0 18px 30px; background:var(--card); border-radius:16px; padding:12px 16px; box-shadow:0 1px 0 var(--line); }
  .dev summary { cursor:pointer; font-weight:600; }
  .dev .row { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; align-items:center; }
  .dev pre { margin:0; max-height:200px; overflow:auto; font:11.5px/1.4 ui-monospace,Menlo,monospace; white-space:pre-wrap; word-break:break-all; }
  .dev .cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:16px; }
  .step { padding:2px 0; display:flex; gap:8px; } .step b { width:2.2em; } .ok { color:var(--green); } .err { color:var(--red); } .mute { color:var(--mute); }
</style>
</head>
<body>
<div class="top">
  <h1>Hallway <small>- every phone below is a different person talking to your real server</small></h1>
  <button id="addPhone">＋ Phone</button>
</div>
<main id="phones"></main>

<details class="dev" id="dev">
  <summary>Developer tools</summary>
  <div class="row">
    <button id="smoke">Run API smoke test</button>
    <button id="selftest">Run UI self-test</button>
    <label class="mute">LiveKit URL <input id="lkUrl" value="wss://jtalk-eimd2bul.livekit.cloud" style="width:300px"></label>
  </div>
  <div class="cols">
    <div><b>API smoke test</b> <span id="smokeResult"></span><div id="smokeOut" class="mute">Walks the whole lifecycle through the HTTP API with three fresh users.</div></div>
    <div><b>UI self-test</b> <span id="selftestResult"></span><div id="selftestOut" class="mute">Drives two phones by clicking their real buttons.</div></div>
    <div><b>API log</b> <button class="ghost" id="clearLog">clear</button><pre id="log"></pre></div>
  </div>
</details>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.0/dist/livekit-client.umd.min.js"></script>
<script>
'use strict';
const API = '/api/v1/voice-rooms';
const $ = id => document.getElementById(id);
const uuid = () => crypto.randomUUID();
const wait = ms => new Promise(r => setTimeout(r, ms));

// ---- tiny DOM helper ------------------------------------------------------------------------------
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'dataset') Object.assign(e.dataset, v);
    else if (k === 'style') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k in e) e[k] = v; else e.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c != null && c !== false) e.append(c.nodeType ? c : document.createTextNode(c)); });
  return e;
}

// ---- languages and people ------------------------------------------------------------------------
const LANG = { en:['🇬🇧','English'], es:['🇪🇸','Spanish'], ar:['🇸🇦','Arabic'], fr:['🇫🇷','French'], de:['🇩🇪','German'], ja:['🇯🇵','Japanese'],
               zh:['🇨🇳','Chinese'], pt:['🇧🇷','Portuguese'], ru:['🇷🇺','Russian'], tr:['🇹🇷','Turkish'], hi:['🇮🇳','Hindi'], it:['🇮🇹','Italian'] };
const flag = c => LANG[c]?.[0] ?? '🏳️';
const langName = c => LANG[c]?.[1] ?? c;
const langOptions = sel => Object.entries(LANG).map(([c, [f, n]]) => h('option', { value: c, selected: c === sel }, `${f} ${n}`));

let users = [];                 // the people you can be: the dev profile's seeded users, or three random ones
const directory = new Map();    // id -> { name, nativeLanguage, learning } for everyone we have seen, bots included
function person(id) { return directory.get(id) || { name: 'Guest ' + String(id).slice(0, 4), nativeLanguage: '', learning: '' }; }
const nameOf = id => person(id).name;
function hue(id) { let x = 0; for (const c of String(id)) x = (x * 31 + c.charCodeAt(0)) % 360; return x; }
function avatar(id, px, extra = {}) {
  const initials = nameOf(id).split(/\s+/).map(w => w[0]).join('').slice(0, 2).toUpperCase();
  return h('div', { class: 'avatar' + (extra.speaking ? ' speaking' : ''), style: { width: px + 'px', height: px + 'px', fontSize: px * .38 + 'px',
    background: `linear-gradient(135deg, hsl(${hue(id)} 60% 52%), hsl(${(hue(id) + 40) % 360} 60% 40%))` } }, initials, extra.badge ? h('span', { class: 'badge' }, extra.badge) : null);
}

// ---- HTTP -------------------------------------------------------------------------------------------
function logLine(text, cls) {
  const b = $('log'); b.prepend(h('div', { class: cls || '' }, text));
  while (b.childNodes.length > 120) b.lastChild.remove();
}
/** One HTTP call as a given user. Never throws; returns { ok, status, data, problem }. */
async function call(method, path, body, as, quiet = false) {
  const t0 = performance.now();
  const res = await fetch(API + path, { method, headers: { 'X-User-Id': as, ...(body ? { 'Content-Type': 'application/json' } : {}) }, body: body ? JSON.stringify(body) : undefined });
  const text = await res.text();
  let data = null; try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  const problem = data?.detail || data?.message || data?.title || (res.ok ? '' : text);
  if (!quiet || !res.ok) logLine(`${res.status} ${nameOf(as)}: ${method} ${path || '/'} (${Math.round(performance.now() - t0)} ms)${res.ok ? '' : ' - ' + problem}`, res.ok ? 'ok' : 'err');
  return { ok: res.ok, status: res.status, data, problem };
}
$('clearLog').onclick = () => $('log').replaceChildren();

// ---- bots: a crowd for testing, kept present by the page ------------------------------------------
const BOT_NAMES = ['Ana', 'Ben', 'Chloe', 'Dmitri', 'Elif', 'Farid', 'Gina', 'Hiro', 'Ines', 'Jamal', 'Kenji', 'Lena', 'Marco', 'Noor', 'Olga', 'Pablo', 'Quinn', 'Rosa', 'Sven', 'Tariq'];
const botsByRoom = new Map();   // roomId -> [botId]
const codes = Object.keys(LANG);
async function addBots(roomId, n) {
  const list = botsByRoom.get(roomId) || []; botsByRoom.set(roomId, list);
  for (let i = 0; i < n; i++) {
    const id = uuid(), name = BOT_NAMES[(list.length + i) % BOT_NAMES.length];
    directory.set(id, { name: name + ' 🤖', nativeLanguage: codes[Math.floor(Math.random() * codes.length)], learning: codes[Math.floor(Math.random() * codes.length)] });
    if ((await call('POST', `/${roomId}/participants/join`, null, id, true)).ok) list.push(id);
  }
}
async function botRaisesHand(roomId) {
  for (const id of botsByRoom.get(roomId) || []) if ((await call('POST', `/${roomId}/stage/raise-hand`, null, id, true)).ok) return nameOf(id);
  return null;
}
async function removeBots(roomId) {
  for (const id of botsByRoom.get(roomId) || []) await call('POST', `/${roomId}/participants/leave`, null, id, true);
  botsByRoom.delete(roomId);
}

// ---- one phone: a user's whole client -------------------------------------------------------------
const phones = [];
class Phone {
  constructor(userId) {
    this.userId = userId; this.screen = 'hall'; this.rooms = []; this.filter = ''; this.room = null;
    this.stage = { speakers: [], handRaiseQueue: [] }; this.people = []; this.session = null; this.sheet = null;
    this.lk = null; this.whisperRoom = null; this.speaking = new Set(); this.whisperWith = null; this.lowBandwidth = false;
    this.root = h('div', { class: 'phone' }); this.toasts = h('div', { class: 'toastbox' });
  }
  get me() { return this.userId; }
  get isHost() { return this.room?.hostId === this.me; }
  get onStage() { return this.stage.speakers.includes(this.me); }
  get roomId() { return this.room?.id; }

  // -- plumbing
  toast(text, bad) { const t = h('div', { class: 'toast' + (bad ? ' err' : '') }, text); this.toasts.append(t); setTimeout(() => t.remove(), bad ? 5000 : 2600); }
  /** The user's version of call(): a failure becomes a toast and stops the action. */
  async api(method, path, body) {
    const r = await call(method, path, body, this.me);
    if (!r.ok) { this.toast(r.problem || ('Error ' + r.status), true); throw Object.assign(new Error(r.problem), r); }
    return r.data;
  }
  act(fn) { return async (...a) => { try { await fn.apply(this, a); } catch (e) { if (!e.status) console.error(e); } this.render(); }; }

  // -- data
  async loadRooms() { const r = await call('GET', '?size=100', null, this.me, true); if (r.ok) this.rooms = r.data.content; }
  async refreshRoom() {
    const r = await call('GET', `/${this.roomId}`, null, this.me, true);
    if (r.status === 404) { this.toast('This room has ended', true); return this.goHall(); }
    if (!r.ok) return;
    const [stage, people] = await Promise.all([call('GET', `/${this.roomId}/stage`, null, this.me, true), call('GET', `/${this.roomId}/participants`, null, this.me, true)]);
    this.room = r.data; if (stage.ok) this.stage = stage.data; if (people.ok) this.people = people.data;
    // A promotion or demotion changes what my LiveKit token may do: fetch a fresh one.
    if (this.session && this.onStage !== this.session.canPublishAudio) {
      const s = await call('POST', `/${this.roomId}/participants/join`, null, this.me, true);
      if (s.ok) { this.session = s.data; if (this.lk) { await this.stopAudio(); await this.startAudio(); } this.toast(this.onStage ? "You're on stage 🎙" : 'You moved to the audience'); }
    }
  }
  /** Called every few seconds: heartbeat (which also notices a kick), then refresh. */
  async poll() {
    try {
      if (this.screen === 'room' && this.room) {
        const hb = await call('POST', `/${this.roomId}/participants/heartbeat`, null, this.me, true);
        if (hb.status === 403) { this.toast('The host removed you from the room', true); return this.goHall(); }
        await this.refreshRoom();
      } else await this.loadRooms();
    } catch (e) { console.error(e); }
    this.render();
  }
  async goHall() { await this.stopAudio(); this.screen = 'hall'; this.room = null; this.session = null; this.stage = { speakers: [], handRaiseQueue: [] }; this.people = []; this.sheet = null; this.whisperWith = null; await this.loadRooms(); this.render(); }

  // -- actions (each wrapped by act(): errors toast, then re-render)
  enter = this.act(async id => {
    this.session = await this.api('POST', `/${id}/participants/join`);
    this.room = this.session.room; this.screen = 'room'; this.sheet = null;
    await this.refreshRoom();
  });
  start = this.act(async form => {
    this.session = await this.api('POST', '', form);
    this.room = this.session.room; this.screen = 'room'; this.sheet = null; await this.refreshRoom();
  });
  leave = this.act(async () => { await this.api('POST', `/${this.roomId}/participants/leave`); await this.goHall(); });
  end = this.act(async () => { const id = this.roomId; await this.api('DELETE', `/${id}`); await removeBots(id); await this.goHall(); this.toast('Room ended'); });
  raise = this.act(async () => { await this.api('POST', `/${this.roomId}/stage/raise-hand`); this.toast('Hand raised ✋'); await this.refreshRoom(); });
  lower = this.act(async () => { await this.api('DELETE', `/${this.roomId}/stage/raise-hand`); await this.refreshRoom(); });
  takeSeat = this.act(async () => { await this.api('POST', `/${this.roomId}/stage/join`); await this.refreshRoom(); });
  leaveStage = this.act(async () => { await this.api('POST', `/${this.roomId}/stage/leave`); this.sheet = null; await this.refreshRoom(); });
  accept = this.act(async id => { await this.api('POST', `/${this.roomId}/stage/promote/${id}`); this.toast(nameOf(id) + ' is on stage'); this.sheet = null; await this.refreshRoom(); });
  demote = this.act(async id => { await this.api('POST', `/${this.roomId}/stage/demote/${id}`); this.sheet = null; await this.refreshRoom(); });
  kick = this.act(async id => { await this.api('DELETE', `/${this.roomId}/participants/${id}`); this.toast(nameOf(id) + ' was removed'); this.sheet = null; await this.refreshRoom(); });
  whisper = this.act(async id => { await this.api('POST', `/${this.roomId}/stage/whisper`, { targetUserId: id }); this.whisperWith = id; this.sheet = null; this.toast('Whispering to ' + nameOf(id)); });
  stopWhisper = this.act(async () => { await this.api('DELETE', `/${this.roomId}/stage/whisper`); this.whisperWith = null; });
  toggleBandwidth = this.act(async () => { const mode = this.lowBandwidth ? 'OPTIMAL' : 'LOW_BANDWIDTH'; await this.api('POST', `/${this.roomId}/stage/network-mode`, { mode }); this.lowBandwidth = !this.lowBandwidth; this.sheet = null; });
  save = this.act(async form => { await this.api('PATCH', `/${this.roomId}`, form); this.sheet = null; this.toast('Room updated'); await this.refreshRoom(); });
  bots = this.act(async n => { this.sheet = null; this.toast(`Adding ${n} bots…`); await addBots(this.roomId, n); await this.refreshRoom(); });
  botHand = this.act(async () => { this.sheet = null; const n = await botRaisesHand(this.roomId); this.toast(n ? n + ' raised a hand' : 'No bot available', !n); await this.refreshRoom(); });
  clearBots = this.act(async () => { this.sheet = null; await removeBots(this.roomId); await this.refreshRoom(); });
  setUser = this.act(async id => { if (this.screen === 'room') await call('POST', `/${this.roomId}/participants/leave`, null, this.me, true); await this.stopAudio(); this.userId = id; await this.goHall(); });

  // -- audio (LiveKit)
  async startAudio() {
    if (!this.session?.liveKitToken || typeof LivekitClient === 'undefined') return;
    const room = new LivekitClient.Room({ adaptiveStream: true });
    room.on(LivekitClient.RoomEvent.TrackSubscribed, t => { if (t.kind === 'audio') document.body.append(t.attach()); });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, t => t.detach().forEach(e => e.remove()));
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, list => { this.speaking = new Set(list.map(p => p.identity)); this.render(); });
    room.on(LivekitClient.RoomEvent.DataReceived, (payload, p, kind, topic) => this.onData(new TextDecoder().decode(payload), topic));
    room.on(LivekitClient.RoomEvent.Disconnected, () => { if (this.lk === room) { this.lk = null; this.render(); } });
    await room.connect($('lkUrl').value.trim(), this.session.liveKitToken);
    this.lk = room;
    if (this.session.canPublishAudio) await room.localParticipant.setMicrophoneEnabled(true).catch(e => this.toast('Microphone: ' + e.message, true));
  }
  async stopAudio() { const r = this.lk; this.lk = null; this.speaking = new Set(); await r?.disconnect(); await this.whisperRoom?.disconnect(); this.whisperRoom = null; }
  toggleAudio = this.act(async () => { if (this.lk) await this.stopAudio(); else await this.startAudio().catch(e => this.toast('LiveKit: ' + e.message, true)); });
  toggleMic = this.act(async () => { const lp = this.lk?.localParticipant; if (lp) await lp.setMicrophoneEnabled(!lp.isMicrophoneEnabled).catch(e => this.toast('Microphone: ' + e.message, true)); });
  onData(text, topic) {
    let msg; try { msg = JSON.parse(text); } catch { return; }
    if (topic === 'room-events') this.refreshRoom().then(() => this.render());
    if (topic === 'whisper' && msg.action === 'start') {
      const other = msg.speakerId === this.me ? msg.targetId : msg.speakerId;
      this.sheet = { kind: 'whisperInvite', other, token: msg.token }; this.render();
    }
    if (topic === 'whisper' && msg.action === 'stop') { this.whisperRoom?.disconnect(); this.whisperRoom = null; this.whisperWith = null; this.toast('Whisper ended'); this.render(); }
  }
  joinWhisper = this.act(async () => {
    const { other, token } = this.sheet; this.sheet = null; this.whisperWith = other;
    this.whisperRoom = new LivekitClient.Room(); await this.whisperRoom.connect($('lkUrl').value.trim(), token);
    await this.whisperRoom.localParticipant.setMicrophoneEnabled(true).catch(() => {});
  });

  // -- rendering
  render() {
    if (this.sheet?.form && this.sheet.shown) return;   // never rebuild under the user's fingers while a form is open
    const old = this.root.querySelector('.scroll')?.scrollTop ?? 0;
    this.root.replaceChildren(this.statusBar(), this.screen === 'room' && this.room ? this.roomView() : this.hallView(), this.screen === 'room' && this.room ? this.roomBar() : this.fab(), this.sheetView(), this.toasts);
    const sc = this.root.querySelector('.scroll'); if (sc) sc.scrollTop = old;
    if (this.sheet?.form) this.sheet.shown = true;
  }
  statusBar() {
    return h('div', { class: 'status' },
      avatar(this.me, 26),
      h('select', { dataset: { act: 'user' }, onchange: e => this.setUser(e.target.value) }, users.map(u => h('option', { value: u.id, selected: u.id === this.me }, u.name))),
      this.lk ? h('span', { title: 'audio connected' }, '🔊') : null,
      h('button', { class: 'ghost x', title: 'remove this phone', dataset: { act: 'close-phone' }, onclick: () => removePhone(this) }, '✕'));
  }
  langBadges(r) { return h('div', { class: 'langs' }, h('span', { class: 'lang' }, `${flag(r.targetLanguage)} ${langName(r.targetLanguage)} practice`), h('span', { class: 'lang alt' }, `for ${flag(r.nativeLanguage)} ${langName(r.nativeLanguage)} speakers`)); }

  hallView() {
    const langs = [...new Set(this.rooms.map(r => r.targetLanguage))];
    const shown = this.rooms.filter(r => !this.filter || r.targetLanguage === this.filter);
    return h('div', { class: 'scroll' },
      h('h2', { class: 'title' }, 'Hallway'),
      h('div', { class: 'chips' },
        h('span', { class: 'chip' + (this.filter ? '' : ' on'), onclick: () => { this.filter = ''; this.render(); } }, 'All'),
        langs.map(c => h('span', { class: 'chip' + (this.filter === c ? ' on' : ''), onclick: () => { this.filter = c; this.render(); } }, `${flag(c)} ${langName(c)}`))),
      shown.length ? shown.map(r => this.card(r)) : h('div', { class: 'empty' }, 'No rooms yet.', h('br'), 'Start one with the button below.'));
  }
  card(r) {
    return h('div', { class: 'room-card', dataset: { act: 'card', title: r.title }, onclick: () => this.enter(r.id) },
      h('h3', {}, r.title), h('div', { class: 'topic' }, r.topic || ' '), this.langBadges(r),
      h('div', { class: 'meta' },
        h('div', { class: 'stack' }, r.speakers.slice(0, 5).map(id => avatar(id, 30))),
        h('span', {}, '🎙 ', `${r.speakers.length}/${r.maxStageSeats}`), h('span', {}, '👥 ', r.participantCount), r.handRaiseCount ? h('span', {}, '✋ ', r.handRaiseCount) : null,
        h('span', { style: { marginLeft: 'auto' } }, nameOf(r.hostId) + ' hosts')));
  }
  fab() { return h('button', { class: 'primary fab', dataset: { act: 'start' }, onclick: () => { this.sheet = { kind: 'start', form: true }; this.render(); } }, '＋ Start a room'); }

  roomView() {
    const free = Math.max(0, this.room.maxStageSeats - this.stage.speakers.length);
    const speakerIds = new Set(this.stage.speakers);
    const audience = [...new Set([...this.people.map(p => p.userId), this.me])].filter(id => !speakerIds.has(id));
    const statusOf = id => this.people.find(p => p.userId === id)?.status;
    const cell = (id, px, role) => h('div', { class: 'cell tap', dataset: { act: 'person', name: nameOf(id) }, onclick: () => { this.sheet = { kind: 'person', id }; this.render(); } },
      avatar(id, px, { speaking: this.speaking.has(id), badge: role === 'host' ? '👑' : role === 'speaker' ? '🎙' : null }),
      h('div', { class: 'nm' }, nameOf(id) + (id === this.me ? ' (you)' : '')),
      h('div', { class: 'sub' }, statusOf(id) === 'RECONNECTING' ? 'reconnecting…' : flag(person(id).nativeLanguage) + (person(id).learning ? ' → ' + flag(person(id).learning) : '')));
    return h('div', { class: 'scroll' },
      h('div', { class: 'roomhead' },
        h('button', { class: 'ghost', dataset: { act: 'leave-top' }, onclick: () => this.leave() }, '‹ Hallway'),
        h('div', { class: 't' }, h('h3', {}, this.room.title), h('div', { class: 'topic' }, this.room.topic || ' ')),
        h('button', { class: 'ghost', dataset: { act: 'more' }, onclick: () => { this.sheet = { kind: 'more' }; this.render(); } }, '•••')),
      this.langBadges(this.room),
      this.whisperWith ? h('div', { class: 'banner' }, `🤫 Whispering with ${nameOf(this.whisperWith)}`, h('button', { class: 'ghost', onclick: () => this.stopWhisper() }, 'Stop')) : null,
      h('div', { class: 'section' }, h('span', {}, 'On stage'), h('span', {}, `${this.stage.speakers.length}/${this.room.maxStageSeats}`)),
      h('div', { class: 'grid stage' },
        this.stage.speakers.map(id => cell(id, 76, id === this.room.hostId ? 'host' : 'speaker')),
        Array.from({ length: free }, () => h('div', { class: 'cell' }, h('button', { class: 'seat', title: 'Take this seat', dataset: { act: 'seat' }, disabled: this.onStage, onclick: () => this.takeSeat() }, '＋'), h('div', { class: 'sub' }, 'open seat')))),
      this.stage.handRaiseQueue.length ? h('div', {},
        h('div', { class: 'section' }, h('span', {}, '✋ Raised hands'), h('span', {}, this.stage.handRaiseQueue.length)),
        h('div', { class: 'hands' }, this.stage.handRaiseQueue.map(id => h('div', { class: 'hand' }, avatar(id, 26), nameOf(id),
          this.isHost ? h('button', { class: 'primary', dataset: { act: 'accept', name: nameOf(id) }, onclick: () => this.accept(id) }, 'Invite') : null)))) : null,
      h('div', { class: 'section' }, h('span', {}, 'In the audience'), h('span', {}, audience.length)),
      h('div', { class: 'grid aud' }, audience.map(id => cell(id, 56, null))));
  }
  roomBar() {
    const mine = this.onStage, hand = this.stage.handRaiseQueue.includes(this.me);
    return h('div', { class: 'roombar' },
      h('button', { dataset: { act: 'leave' }, onclick: () => this.leave() }, '✌️ Leave quietly'),
      !mine ? (hand ? h('button', { dataset: { act: 'lower' }, onclick: () => this.lower() }, '✋ Lower hand') : h('button', { class: 'primary', dataset: { act: 'raise' }, onclick: () => this.raise() }, '✋ Raise hand')) : null,
      mine && this.lk ? h('button', { dataset: { act: 'mic' }, onclick: () => this.toggleMic() }, this.lk.localParticipant.isMicrophoneEnabled ? '🎙 Mute' : '🔇 Unmute') : null,
      h('button', { dataset: { act: 'audio' }, title: 'Connect LiveKit audio', onclick: () => this.toggleAudio() }, this.lk ? '🔊 On' : '🔈 Audio'));
  }

  sheetView() {
    const s = this.sheet; if (!s) return h('span');
    const close = () => { this.sheet = null; this.render(); };
    const bg = body => h('div', { class: 'sheet-bg', onclick: e => { if (e.target.classList.contains('sheet-bg')) close(); } }, h('div', { class: 'sheet' }, body));
    if (s.kind === 'person') {
      const id = s.id, p = person(id), isMe = id === this.me, theirsOnStage = this.stage.speakers.includes(id), theirHost = id === this.room.hostId;
      return bg([
        h('div', { class: 'who' }, avatar(id, 64), h('div', {}, h('b', {}, p.name + (isMe ? ' (you)' : '')), h('div', { class: 'mute' }, theirHost ? 'Host' : theirsOnStage ? 'Speaker' : 'Listener'),
          p.nativeLanguage ? h('div', {}, `Speaks ${flag(p.nativeLanguage)} ${langName(p.nativeLanguage)}${p.learning ? ` · learning ${flag(p.learning)} ${langName(p.learning)}` : ''}`) : null)),
        h('div', { class: 'actions' },
          this.isHost && !isMe && !theirsOnStage ? h('button', { class: 'primary', dataset: { act: 'invite' }, onclick: () => this.accept(id) }, 'Invite to stage') : null,
          this.isHost && !isMe && theirsOnStage ? h('button', { dataset: { act: 'demote' }, onclick: () => this.demote(id) }, 'Move to audience') : null,
          this.onStage && !isMe && theirsOnStage && this.room.allowWhisper ? h('button', { dataset: { act: 'whisper' }, onclick: () => this.whisper(id) }, `🤫 Whisper to ${p.name}`) : null,
          isMe && theirsOnStage && !theirHost ? h('button', { dataset: { act: 'leave-stage' }, onclick: () => this.leaveStage() }, 'Step down to the audience') : null,
          this.isHost && !isMe ? h('button', { class: 'danger', dataset: { act: 'kick' }, onclick: () => this.kick(id) }, 'Remove from room') : null,
          h('button', { class: 'ghost', onclick: close }, 'Close'))]);
    }
    if (s.kind === 'more') {
      return bg([h('h3', {}, 'Room options'), h('div', { class: 'actions' },
        this.isHost ? h('button', { dataset: { act: 'edit' }, onclick: () => { this.sheet = { kind: 'edit', form: true }; this.render(); } }, '✏️ Edit room') : null,
        h('button', { dataset: { act: 'bandwidth' }, onclick: () => this.toggleBandwidth() }, this.lowBandwidth ? '📶 Back to optimal quality' : '📉 Low-bandwidth mode'),
        h('button', { dataset: { act: 'bots' }, onclick: () => this.bots(5) }, '🤖 Add 5 bot listeners'),
        h('button', { dataset: { act: 'bot-hand' }, onclick: () => this.botHand() }, '🤖 A bot raises a hand'),
        h('button', { dataset: { act: 'bots-clear' }, onclick: () => this.clearBots() }, '🤖 Remove bots'),
        this.isHost ? h('button', { class: 'danger', dataset: { act: 'end' }, onclick: () => this.end() }, '🛑 End room for everyone') : null,
        h('button', { class: 'ghost', onclick: close }, 'Close'))]);
    }
    if (s.kind === 'start' || s.kind === 'edit') {
      const editing = s.kind === 'edit', r = this.room || {};
      const f = { title: h('input', { value: editing ? r.title : 'Practice room', dataset: { f: 'title' } }), topic: h('input', { value: editing ? r.topic || '' : 'Just chatting', dataset: { f: 'topic' } }),
        target: h('select', { dataset: { f: 'target' } }, langOptions('es')), native: h('select', { dataset: { f: 'native' } }, langOptions('en')),
        seats: h('select', { dataset: { f: 'seats' } }, Array.from({ length: 11 }, (_, i) => h('option', { value: i + 2, selected: i + 2 === (editing ? r.maxStageSeats : 6) }, i + 2))),
        whisper: h('input', { type: 'checkbox', checked: true, style: { width: 'auto' }, dataset: { f: 'whisper' } }) };
      const submit = () => editing
        ? this.save({ title: f.title.value, topic: f.topic.value, maxStageSeats: +f.seats.value })
        : this.start({ title: f.title.value, topic: f.topic.value, targetLanguage: f.target.value, nativeLanguage: f.native.value, maxStageSeats: +f.seats.value, allowWhisper: f.whisper.checked });
      return bg([h('h3', {}, editing ? 'Edit room' : 'Start a room'),
        h('label', {}, 'Title'), f.title, h('label', {}, 'Topic'), f.topic,
        editing ? null : h('div', { class: 'two' }, h('div', {}, h('label', {}, 'I want to practice'), f.target), h('div', {}, h('label', {}, 'Speakers of'), f.native)),
        h('label', {}, 'Stage seats (including you)'), f.seats,
        editing ? null : h('label', { style: { display: 'flex', gap: '8px', alignItems: 'center', color: 'inherit' } }, f.whisper, 'Allow whispering'),
        h('div', { class: 'actions' }, h('button', { class: 'primary', dataset: { act: 'go' }, onclick: submit }, editing ? 'Save' : "Let's go"), h('button', { class: 'ghost', onclick: close }, 'Cancel'))]);
    }
    if (s.kind === 'whisperInvite') {
      return bg([h('h3', {}, '🤫 Private whisper'), h('div', {}, `${nameOf(s.other)} wants a private word. Joining moves your microphone into a two-person room.`),
        h('div', { class: 'actions' }, h('button', { class: 'primary', onclick: () => this.joinWhisper() }, 'Join whisper'), h('button', { class: 'ghost', onclick: close }, 'Not now'))]);
    }
    return h('span');
  }
}

function addPhone(userId) {
  const phone = new Phone(userId); phones.push(phone); $('phones').append(phone.root); phone.goHall(); return phone;
}
function removePhone(phone) { phone.stopAudio(); if (phone.screen === 'room') call('POST', `/${phone.roomId}/participants/leave`, null, phone.me, true); phones.splice(phones.indexOf(phone), 1); phone.root.remove(); }
$('addPhone').onclick = () => addPhone(users[phones.length % users.length].id);

// ---- background: heartbeats and refresh, like a real app ------------------------------------------
setInterval(() => {
  if (document.hidden) return;
  phones.forEach(p => p.poll());
  botsByRoom.forEach((ids, roomId) => ids.forEach(id => call('POST', `/${roomId}/participants/heartbeat`, null, id, true)));
}, 3000);

// ---- API smoke test: the whole lifecycle with three fresh users ------------------------------------
async function smokeTest() {
  const out = $('smokeOut'); out.className = ''; out.replaceChildren(); $('smokeResult').textContent = '';
  const [A, B, C] = [uuid(), uuid(), uuid()], lang = 'sm' + Math.random().toString(36).slice(2, 6);
  [[A, 'Smoke A'], [B, 'Smoke B'], [C, 'Smoke C']].forEach(([id, name]) => directory.set(id, { name, nativeLanguage: '', learning: '' }));
  let failed = 0, id = null;
  const step = async (label, fn) => {
    const mark = h('b', {}, '…'), line = h('div', { class: 'step' }, mark, label); out.append(line);
    try { const msg = await fn(); mark.textContent = 'OK'; mark.className = 'ok'; if (msg) line.append(h('span', { class: 'mute' }, ' - ' + msg)); }
    catch (e) { failed++; mark.textContent = 'X'; mark.className = 'err'; line.append(h('span', { class: 'err' }, ' - ' + e.message)); }
  };
  const must = (r, status) => { if (r.status !== status) throw new Error(`expected ${status}, got ${r.status} ${r.problem || ''}`); return r.data; };
  const expect = (cond, msg) => { if (!cond) throw new Error(msg); };
  const q = '?targetLanguage=' + lang;
  await step('Host creates a room', async () => { const d = must(await call('POST', '', { title: 'Smoke room', targetLanguage: lang, nativeLanguage: 'en' }, A, true), 201); id = d.room.id; expect(d.role === 'HOST' && d.liveKitToken, 'no host token'); return 'role HOST, token issued'; });
  await step('Room is discoverable', async () => { const d = must(await call('GET', q, null, B, true), 200); expect(d.content.some(r => r.id === id), 'not in discovery'); });
  await step('Listener joins', async () => { const d = must(await call('POST', `/${id}/participants/join`, null, B, true), 200); expect(d.role === 'LISTENER', 'role ' + d.role); return 'role LISTENER'; });
  await step('Heartbeats make both present', async () => { await Promise.all([A, B].map(u => call('POST', `/${id}/participants/heartbeat`, null, u, true))); const d = must(await call('GET', `/${id}/participants`, null, A, true), 200); expect([A, B].every(u => d.some(p => p.userId === u)), 'participants: ' + d.length); });
  await step('Listener raises a hand', async () => { must(await call('POST', `/${id}/stage/raise-hand`, null, B, true), 202); const d = must(await call('GET', `/${id}/stage`, null, A, true), 200); expect(d.handRaiseQueue.includes(B), 'not queued'); });
  await step('Only the host can promote', async () => { expect(!(await call('POST', `/${id}/stage/promote/${B}`, null, C, true)).ok, 'a stranger could promote'); });
  await step('Host promotes the listener', async () => { must(await call('POST', `/${id}/stage/promote/${B}`, null, A, true), 204); const d = must(await call('GET', `/${id}/stage`, null, A, true), 200); expect(d.speakers.includes(B) && !d.handRaiseQueue.includes(B), 'stage not updated'); });
  await step('Speaker whispers to a speaker, then stops', async () => { must(await call('POST', `/${id}/stage/whisper`, { targetUserId: B }, A, true), 204); must(await call('DELETE', `/${id}/stage/whisper`, null, A, true), 204); });
  await step('Network mode can be switched', async () => { must(await call('POST', `/${id}/stage/network-mode`, { mode: 'LOW_BANDWIDTH' }, B, true), 204); });
  await step('Kicked user is barred, heartbeat included', async () => {
    must(await call('POST', `/${id}/participants/join`, null, C, true), 200);
    must(await call('DELETE', `/${id}/participants/${C}`, null, A, true), 204);
    const again = await call('POST', `/${id}/participants/join`, null, C, true); expect(!again.ok, 'a kicked user rejoined');
    const hb = await call('POST', `/${id}/participants/heartbeat`, null, C, true); expect(hb.status === 403, 'a kicked heartbeat was accepted: ' + hb.status);
    const list = must(await call('GET', `/${id}/participants`, null, A, true), 200); expect(!list.some(p => p.userId === C), 'kicked user reappeared');
    return 'rejoin ' + again.status + ', heartbeat ' + hb.status;
  });
  await step('Host re-creating returns the same room', async () => { const d = must(await call('POST', '', { title: 'Another', targetLanguage: lang, nativeLanguage: 'en' }, A, true), 201); expect(d.room.id === id, 'a second room was opened'); });
  await step('Host closes the room', async () => { must(await call('DELETE', `/${id}`, null, A, true), 204); expect((await call('GET', `/${id}`, null, B, true)).status === 404, 'room still visible'); });
  $('smokeResult').className = failed ? 'err' : 'ok'; $('smokeResult').id = 'smokeResult';
  $('smokeResult').textContent = failed ? failed + ' step(s) failed' : 'All steps passed';
}
$('smoke').onclick = smokeTest;

// ---- UI self-test: two phones, driven by clicking their real buttons ------------------------------
async function selfTest() {
  const out = $('selftestOut'); out.className = ''; out.replaceChildren(); $('selftestResult').textContent = '';
  const host = users.find(u => u.name === 'Priya') || users.at(-1), guest = users.find(u => u.name === 'Lucas') || users[0];
  const A = addPhone(host.id), B = addPhone(guest.id);
  const title = 'Self-test ' + Math.random().toString(36).slice(2, 6);
  let failed = 0;
  const q = (phone, sel, text) => [...phone.root.querySelectorAll(sel)].find(e => !text || e.textContent.includes(text) || e.dataset.name === text);
  const until = async (label, fn, ...ps) => { for (let i = 0; i < 40; i++) { if (fn()) return; for (const p of ps) await p.poll(); await wait(150); } throw new Error('timed out: ' + label); };
  const click = (phone, act, text) => { const e = q(phone, `[data-act="${act}"]`, text); if (!e) throw new Error(`no ${act} button${text ? ' for ' + text : ''}`); e.click(); };
  const step = async (label, fn) => {
    const mark = h('b', {}, '…'), line = h('div', { class: 'step' }, mark, label); out.append(line);
    try { await fn(); mark.textContent = 'OK'; mark.className = 'ok'; } catch (e) { failed++; mark.textContent = 'X'; mark.className = 'err'; line.append(h('span', { class: 'err' }, ' - ' + e.message)); }
  };
  await until('both phones in the hallway', () => A.screen === 'hall' && B.screen === 'hall' && A.rooms.length > 0, A, B);
  await step(`${nameOf(host.id)} starts a room from the sheet`, async () => {
    click(A, 'start'); await until('start sheet', () => q(A, '[data-f="title"]'));
    q(A, '[data-f="title"]').value = title; q(A, '[data-f="target"]').value = 'it'; click(A, 'go');
    await until('in the room', () => A.screen === 'room' && A.room?.title === title);
  });
  await step('the host is on stage and wears a crown', async () => { await until('host on stage', () => A.onStage && A.root.textContent.includes('👑'), A); });
  await step(`${nameOf(guest.id)} finds the card in the hallway and taps it`, async () => {
    await until('card visible', () => q(B, '[data-act="card"]', title), B); click(B, 'card', title);
    await until('in the room', () => B.screen === 'room' && B.room?.title === title);
  });
  await step('both phones see each other in the room', async () => { await until('mutual', () => q(A, '[data-act="person"]', nameOf(guest.id)) && q(B, '[data-act="person"]', nameOf(host.id)), A, B); });
  await step('the listener raises a hand; the host sees it and invites', async () => {
    click(B, 'raise'); await until('hand on host phone', () => q(A, '[data-act="accept"]', nameOf(guest.id)), A, B);
    click(A, 'accept', nameOf(guest.id));
  });
  await step('the invited listener is now a speaker with a fresh token', async () => { await until('on stage', () => B.onStage && B.session.canPublishAudio && q(B, '[data-act="mic"], [data-act="audio"]'), B, A); });
  await step('the host adds five bot listeners; the audience grows', async () => {
    click(A, 'more'); await until('options sheet', () => q(A, '[data-act="bots"]')); click(A, 'bots');
    await until('audience of 5+', () => A.people.length >= 6, A);
  });
  await step('the host removes the guest; their phone goes back to the hallway', async () => {
    click(A, 'person', nameOf(guest.id)); await until('person sheet', () => q(A, '[data-act="kick"]')); click(A, 'kick');
    await until('guest kicked out', () => B.screen === 'hall', B, A);
  });
  await step('the kicked guest cannot sneak back in', async () => {
    const r = await call('POST', `/${A.roomId}/participants/join`, null, B.me, true); if (r.status !== 403) throw new Error('rejoin returned ' + r.status);
    await A.poll(); if (A.people.some(p => p.userId === B.me)) throw new Error('guest is still listed');
  });
  await step('the host ends the room for everyone', async () => {
    click(A, 'more'); await until('options sheet', () => q(A, '[data-act="end"]')); click(A, 'end'); await until('host back in hallway', () => A.screen === 'hall', A);
    await until('room gone from the hallway', () => !A.rooms.some(r => r.title === title), A);
  });
  removePhone(A); removePhone(B);
  $('selftestResult').id = 'selftestResult'; $('selftestResult').className = failed ? 'err' : 'ok';
  $('selftestResult').textContent = failed ? failed + ' step(s) failed' : 'All steps passed';
}
$('selftest').onclick = selfTest;

// ---- start -------------------------------------------------------------------------------------------
(async function main() {
  try { const r = await fetch('/dev/users'); if (r.ok) users = await r.json(); } catch { /* not the dev profile */ }
  if (!users.length) users = ['Alice', 'Bob', 'Carol'].map(name => ({ id: uuid(), name, nativeLanguage: 'en', learning: 'es' }));
  users.forEach(u => directory.set(u.id, u));
  addPhone(users[0].id); addPhone(users[1].id);
  const mode = new URLSearchParams(location.search);
  if (mode.has('enter')) {   // ?enter=Spanish opens the first room whose title contains "Spanish" on every phone
    await Promise.all(phones.map(p => p.goHall()));
    const room = phones[0].rooms.find(r => r.title.toLowerCase().includes(mode.get('enter').toLowerCase()));
    if (room) await Promise.all(phones.map(p => p.enter(room.id)));
  }
  if (mode.has('smoke')) { $('dev').open = true; smokeTest(); }
  if (mode.has('selftest')) { $('dev').open = true; phones.splice(0).forEach(p => p.root.remove()); selfTest(); }
})();

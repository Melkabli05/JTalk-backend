# The "dev" profile: everything that exists only to make local development easy. `./gradlew run` activates it
# (see build.gradle.kts); a built jar or container never does unless MICRONAUT_ENVIRONMENTS says so.
micronaut:
  security:
    # No token needed: the caller is identified by the X-User-Id header (a UUID) that anyone can set. Local use only.
    enabled: false
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: dev-profile-secret-unused-while-security-is-off-0123456789
  router:
    static-resources:
      # The developer test page at /ui/index.html
      ui:
        paths: classpath:public
        mapping: /ui/**

# LiveKit Cloud project "jtalk" for development: set LIVEKIT_API_KEY and LIVEKIT_API_SECRET in the environment.
livekit:
  url: wss://jtalk-eimd2bul.livekit.cloud
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}

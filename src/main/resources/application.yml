micronaut:
  application:
    name: live-communication-service
  security:
    # Secure by default: callers authenticate with a JWT bearer token issued upstream (API gateway / identity provider);
    # the token's subject is the user id. Tokens are verified with this shared HS256 secret (32+ characters), or switch to
    # a JWKS endpoint with micronaut.security.token.jwt.signatures.jwks. The "dev" profile switches this off.
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET}

# PostgreSQL and Redis connections are intentionally NOT configured here:
#  - locally (./gradlew run, tests) Micronaut Test Resources starts containers for them;
#  - deployed, set DATASOURCES_DEFAULT_URL / _USERNAME / _PASSWORD and REDIS_URI.
# voice-room.* tunables have defaults in VoiceRoomProperties.
datasources:
  default:
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true

# LiveKit (Cloud or self-hosted). The "dev" profile hardcodes the development project.
livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}

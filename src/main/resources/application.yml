micronaut:
  application:
    name: live-communication-service
  security:
    # Callers authenticate with a JWT bearer token issued upstream (API gateway / identity provider); the token's
    # subject is the user id. Tokens are verified with this shared HS256 secret (32+ characters), or switch to a
    # JWKS endpoint with micronaut.security.token.jwt.signatures.jwks.
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET}

# PostgreSQL and Redis connections are intentionally NOT configured here:
#  - locally (./gradlew run, tests) Micronaut Test Resources starts containers for them;
#  - deployed, set DATASOURCES_DEFAULT_URL / _USERNAME / _PASSWORD and REDIS_URI.
# voice-room.* tunables have defaults in VoiceRoomProperties.
datasources:
  default:
    dialect: POSTGRES

flyway:
  datasources:
    default:
      enabled: true

# LiveKit Cloud project "jtalk". The secret is not in the repo: set LIVEKIT_API_SECRET in the environment.
livekit:
  url: wss://jtalk-eimd2bul.livekit.cloud
  api-key: APIMcbg56rh8NAv
  api-secret: ${LIVEKIT_API_SECRET}

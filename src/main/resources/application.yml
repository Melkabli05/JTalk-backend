micronaut:
  application:
    name: live-communication-service
  security:
    # Secure by default: callers authenticate with a JWT bearer token issued upstream (API gateway / identity provider);
    # the token's subject is the user id. Tokens are verified with this shared HS256 secret (32+ characters), or switch to
    # a JWKS endpoint with micronaut.security.token.jwt.signatures.jwks. Switch it off for local work with MICRONAUT_SECURITY_ENABLED=false.
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET}
  server:
    # A browser app on another origin (the frontend) may call this API. Origins are matched as a regular expression: any origin until
    # CORS_ALLOWED_ORIGINS narrows it to your frontend, e.g. CORS_ALLOWED_ORIGINS='https://app\.example\.com|http://localhost:4200'.
    # Callers authenticate with a header, not a cookie, so an open list exposes no one's session.
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins-regex: ${CORS_ALLOWED_ORIGINS:.*}
          allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
          allowed-headers: [Authorization, Content-Type, X-User-Id]
          max-age: 3600

# PostgreSQL and Redis connections are intentionally NOT configured here:
#  - locally (./gradlew run, tests) Micronaut Test Resources starts containers for them;
#  - deployed, set DATASOURCES_DEFAULT_URL / _USERNAME / _PASSWORD and REDIS_URI.
# voice-room.* tunables have defaults in VoiceRoomProperties.
datasources:
  default:
    dialect: POSTGRES
    # Fail fast when the database is down: Hikari's default is 30 s, which keeps probes and callers hanging.
    connection-timeout: 3000

flyway:
  datasources:
    default:
      enabled: true

# LiveKit (Cloud or self-hosted): set LIVEKIT_URL, LIVEKIT_API_KEY and LIVEKIT_API_SECRET.
livekit:
  url: ${LIVEKIT_URL}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}

# Health probes for the load balancer or orchestrator. /health answers without a token (a probe carries none), but anonymous callers
# get only the overall status: the details (database, Redis) are for authenticated callers. That is the endpoint's default; it is
# stated anyway so an upgrade cannot quietly change it (HealthEndpointTest guards it).
endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: AUTHENTICATED
